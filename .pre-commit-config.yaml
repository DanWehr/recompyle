repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.14.9
  hooks:
    - id: ruff-check
      args: [ --fix ]
    - id: ruff-format
-   repo: local
    hooks:
    -   id: test-all
        name: test-all
        entry: just test-all
        language: system
        pass_filenames: false
        always_run: true
